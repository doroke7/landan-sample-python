# 把 sample/image_albumentations/runtime/raw 的一張圖擴增 count 張，所有轉換都列出來，適合影像辨識（物件偵測、分類）的有開（p 大於 0），不適合的 p 設 0，想用就改成大於 0，轉換依序執行，每一項是 Albumentations 的類別名稱，底下是它的參數（參數名稱同官方文件）
# p 是觸發機率（0 到 1），0 是不用；中括號 [a, b] 是範圍或尺寸；順序很重要：固定尺寸的裁切放最前面、會改尺寸的（Pad、Resize 等）放最後，不然尺寸被前面的轉換改掉會報錯

name: 2026-08-09@036                                        # runtime/raw 裡的檔名（不含副檔名），要有同名的 .png 和 .json
count: 50                                                   # 擴增幾張，範圍 1 以上
bbox:                                                       # 框的處理（BboxParams）
  min_area: 0.0                                             # 轉換後框的面積小於這個值（像素）就移除，範圍 0 以上
  min_visibility: 0.0                                       # 轉換後框還留在畫面內的比例小於這個值就移除，範圍 0 到 1，0 是不檢查
transforms:                                                 # 依序執行的轉換；上面是有開的（p 大於 0），下面是 p 為 0 的（不用）
  HorizontalFlip:                                           # 左右翻轉
    p: 0.5
  VerticalFlip:                                             # 上下翻轉
    p: 0.3
  Rotate:                                                   # 旋轉
    limit: 0
    p: 0.5
  SafeRotate:                                               # 安全旋轉（整張留在畫面內）
    limit: 4
    p: 0.5
  Affine:                                                   # 仿射（縮放、平移、旋轉、傾斜）
    scale: [0.9, 1.1]
    translate_percent: [-0.0, 0.0]
    rotate: [-2, 2]
    shear: [-4, 4]
    p: 0.3
  Perspective:                                              # 透視變形
    scale: [0.02, 0.05]
    p: 0.3
  RandomBrightnessContrast:                                 # 亮度對比
    brightness_limit: [-0.2, 0.2]
    contrast_limit: [-0.2, 0.2]
    p: 0.5
  RandomGamma:                                              # Gamma
    gamma_limit: [80, 120]
    p: 0.3
  CLAHE:                                                    # 局部對比增強
    clip_limit: 4.0
    p: 0.3
  Illumination:                                             # 光照
    mode: "linear"
    intensity_range: [0.01, 0.2]
    effect_type: "both"
    angle_range: [0, 360]
    center_range: [0.1, 0.9]
    sigma_range: [0.2, 1.0]
    p: 0.3
  ColorJitter:                                              # 色彩抖動
    brightness: 0.1
    contrast: 0.2
    saturation: 0.2
    hue: 0.02
    p: 0.3
  HueSaturationValue:                                       # 色相飽和度明度
    hue_shift_limit: 10
    sat_shift_limit: 20
    val_shift_limit: 20
    p: 0.3
  GaussianBlur:                                             # 高斯模糊
    blur_limit: [3, 7]
    p: 0.3
  MotionBlur:                                               # 動態模糊
    blur_limit: 7
    p: 0.3
  Sharpen:                                                  # 銳化
    alpha: [0.2, 0.5]
    lightness: [0.5, 1.0]
    p: 0.3
  GaussNoise:                                               # 高斯雜訊
    std_range: [0.02, 0.1]
    mean_range: [0.0, 0.0]
    per_channel: true
    p: 0.3
  ISONoise:                                                 # ISO 雜訊
    color_shift: [0.01, 0.05]
    intensity: [0.1, 0.5]
    p: 0.3
  ImageCompression:                                         # 壓縮失真
    compression_type: "jpeg"
    quality_range: [60, 100]
    p: 0.3
  RandomShadow:                                             # 隨機陰影
    shadow_roi: [0, 0.5, 1, 1]
    num_shadows_limit: [1, 2]
    shadow_dimension: 5
    shadow_intensity_range: [0.5, 0.5]
    p: 0.3

  PiecewiseAffine:                                          # 局部仿射扭曲
    scale: [0.010, 0.020]
    nb_rows: 8
    nb_cols: 8
    p: 0.3


  ###########################################################################################
  ########################################################################################################
  # ---------- 以下 p 是 0，不用；要用就把 p 改成大於 0，注意固定尺寸的裁切要在前面、會改尺寸的要在後面 ----------
  RandomSizedBBoxSafeCrop:                                  # 不切到框的隨機裁切並縮放
    height: 720
    width: 1280
    p: 0
  CoarseDropout:                                            # 隨機挖洞
    num_holes_range: [1, 2]
    hole_height_range: [0.1, 0.2]
    hole_width_range: [0.1, 0.2]
    fill: 0
    p: 0
  Downscale:                                                # 縮小再放大
    scale_range: [0.25, 0.25]
    p: 0
  RandomRotate90:                                           # 隨機轉 90 度
    p: 0
  RandomResizedCrop:                                        # 隨機裁切並縮放
    size: [720, 1280]
    scale: [0.5, 1.0]
    p: 0
  RandomSizedCrop:                                          # 隨機大小裁切並縮放
    min_max_height: [400, 576]
    size: [720, 1280]
    w2h_ratio: 1.7777777777777777
    p: 0
  RandomCrop:                                               # 隨機裁切
    height: 576
    width: 1024
    p: 0
  CenterCrop:                                               # 中心裁切
    height: 576
    width: 1024
    p: 0
  Crop:                                                     # 固定區域裁切
    x_min: 0
    y_min: 0
    x_max: 1024
    y_max: 576
    p: 0
  AtLeastOneBBoxRandomCrop:                                 # 至少含一個框的隨機裁切
    height: 576
    width: 1024
    p: 0
  BBoxSafeRandomCrop:                                       # 不切到框的隨機裁切
    erosion_rate: 0.0
    p: 0
  RandomCropFromBorders:                                    # 四邊隨機裁切
    crop_left: 0.1
    crop_right: 0.1
    crop_top: 0.1
    crop_bottom: 0.1
    p: 0
  CropAndPad:                                               # 裁切或補邊
    percent: [-0.1, 0.1]
    p: 0
  Transpose:                                                # 轉置
    p: 0
  D4:                                                       # D4 對稱（8 種翻轉旋轉）
    p: 0
  SquareSymmetry:                                           # 正方形對稱
    p: 0

  ElasticTransform:                                         # 彈性扭曲
    alpha: 1
    sigma: 50
    p: 0
  GridDistortion:                                           # 格子扭曲
    num_steps: 5
    distort_limit: 0.3
    p: 0
  GridElasticDeform:                                        # 格子彈性變形
    num_grid_xy: [4, 4]
    magnitude: 10
    p: 0
  OpticalDistortion:                                        # 鏡頭扭曲
    distort_limit: 0.05
    p: 0
  ThinPlateSpline:                                          # 薄板樣條變形
    scale_range: [0.2, 0.4]
    p: 0
  RandomGridShuffle:                                        # 格子打亂
    grid: [3, 3]
    p: 0
  ConstrainedCoarseDropout:                                 # 框內隨機挖洞
    num_holes_range: [1, 1]
    hole_height_range: [0.1, 0.1]
    hole_width_range: [0.1, 0.1]
    fill: 0
    p: 0
  GridDropout:                                              # 格子挖洞
    ratio: 0.5
    p: 0
  PixelDropout:                                             # 像素丟棄
    dropout_prob: 0.01
    p: 0
  XYMasking:                                                # 橫直線遮罩
    num_masks_x: [1, 2]
    num_masks_y: [1, 2]
    mask_x_length: [20, 60]
    mask_y_length: [20, 60]
    p: 0
  Erasing:                                                  # 隨機擦掉
    scale: [0.02, 0.33]
    p: 0
  Morphological:                                            # 形態學（膨脹、侵蝕）
    scale: [2, 3]
    operation: "dilation"
    p: 0
  Pad:                                                      # 補邊
    padding: 20
    p: 0
  PadIfNeeded:                                              # 不足就補邊
    min_height: 800
    min_width: 1400
    p: 0
  RandomScale:                                              # 隨機縮放
    scale_limit: 0.1
    p: 0
  Resize:                                                   # 縮放
    height: 360
    width: 640
    p: 0
  LongestMaxSize:                                           # 最長邊縮放
    max_size: 800
    p: 0
  SmallestMaxSize:                                          # 最短邊縮放
    max_size: 400
    p: 0
  RandomToneCurve:                                          # 色調曲線
    scale: 0.1
    p: 0
  Equalize:                                                 # 直方圖均衡化
    mode: "cv"
    by_channels: true
    p: 0
  AutoContrast:                                             # 自動對比
    cutoff: 0
    method: "cdf"
    p: 0
  PlasmaBrightnessContrast:                                 # 雲狀亮度對比
    brightness_range: [-0.3, 0.3]
    contrast_range: [-0.3, 0.3]
    plasma_size: 256
    roughness: 3.0
    p: 0
  PlasmaShadow:                                             # 雲狀陰影
    shadow_intensity_range: [0.3, 0.7]
    plasma_size: 256
    roughness: 3.0
    p: 0
  RGBShift:                                                 # RGB 位移
    r_shift_limit: 20
    g_shift_limit: 20
    b_shift_limit: 20
    p: 0
  PlanckianJitter:                                          # 色溫
    mode: "blackbody"
    sampling_method: "uniform"
    p: 0
  ChannelShuffle:                                           # 通道換位
    p: 0
  ChannelDropout:                                           # 通道丟棄
    channel_drop_range: [1, 1]
    fill: 0
    p: 0
  ToGray:                                                   # 轉灰階
    num_output_channels: 3
    method: "weighted_average"
    p: 1
  ToSepia:                                                  # 轉棕褐色
    p: 0
  InvertImg:                                                # 反相
    p: 0
  Solarize:                                                 # 曝光過度
    threshold_range: [0.5, 0.5]
    p: 0
  Posterize:                                                # 色調分離
    num_bits: 4
    p: 0
  FancyPCA:                                                 # PCA 改色
    alpha: 0.1
    p: 0
  Blur:                                                     # 平均模糊
    blur_limit: 7
    p: 0
  MedianBlur:                                               # 中值模糊
    blur_limit: 5
    p: 0
  AdvancedBlur:                                             # 進階模糊
    blur_limit: [3, 7]
    sigma_x_limit: [0.2, 1.0]
    sigma_y_limit: [0.2, 1.0]
    rotate_limit: [-90, 90]
    beta_limit: [0.5, 8.0]
    noise_limit: [0.9, 1.1]
    p: 0
  Defocus:                                                  # 失焦模糊
    radius: [3, 10]
    alias_blur: [0.1, 0.5]
    p: 0
  ZoomBlur:                                                 # 縮放模糊
    max_factor: [1, 1.31]
    step_factor: [0.01, 0.03]
    p: 0
  GlassBlur:                                                # 玻璃模糊
    sigma: 0.7
    max_delta: 4
    iterations: 2
    mode: "fast"
    p: 0
  UnsharpMask:                                              # 反銳化遮罩
    blur_limit: [3, 7]
    sigma_limit: 0.0
    alpha: [0.2, 0.5]
    threshold: 10
    p: 0
  Emboss:                                                   # 浮雕
    alpha: [0.2, 0.5]
    strength: [0.2, 0.7]
    p: 0
  RingingOvershoot:                                         # 邊緣振鈴
    blur_limit: [7, 15]
    cutoff: [0.7853981633974483, 1.5707963267948966]
    p: 0
  Superpixels:                                              # 超像素
    p_replace: [0, 0.1]
    n_segments: [100, 100]
    max_size: 128
    p: 0
  AdditiveNoise:                                            # 加法雜訊
    noise_type: "uniform"
    spatial_mode: "constant"
    approximation: 1.0
    p: 0
  MultiplicativeNoise:                                      # 乘法雜訊
    multiplier: [0.9, 1.1]
    p: 0
  ShotNoise:                                                # 散粒雜訊
    scale_range: [0.1, 0.3]
    p: 0
  SaltAndPepper:                                            # 椒鹽雜訊
    amount: [0.01, 0.06]
    salt_vs_pepper: [0.4, 0.6]
    p: 0
  ChromaticAberration:                                      # 色差
    primary_distortion_limit: [-0.02, 0.02]
    secondary_distortion_limit: [-0.05, 0.05]
    mode: "green_purple"
    p: 0
  RandomFog:                                                # 霧
    alpha_coef: 0.08
    fog_coef_range: [0.3, 1]
    p: 0
  RandomRain:                                               # 雨
    slant_range: [-10, 10]
    drop_width: 1
    drop_color: [200, 200, 200]
    blur_value: 7
    brightness_coefficient: 0.7
    rain_type: "default"
    p: 0
  RandomSnow:                                               # 雪
    brightness_coeff: 2.5
    snow_point_range: [0.1, 0.3]
    method: "bleach"
    p: 0
  RandomSunFlare:                                           # 太陽光暈
    flare_roi: [0, 0, 1, 0.5]
    src_radius: 400
    src_color: [255, 255, 255]
    angle_range: [0, 1]
    num_flare_circles_range: [6, 10]
    method: "overlay"
    p: 0
  RandomGravel:                                             # 碎石
    gravel_roi: [0.1, 0.4, 0.9, 0.9]
    number_of_patches: 2
    p: 0
  Spatter:                                                  # 噴濺
    mean: [0.65, 0.65]
    std: [0.3, 0.3]
    gauss_sigma: [2, 2]
    cutout_threshold: [0.68, 0.68]
    intensity: [0.6, 0.6]
    mode: "rain"
    p: 0
